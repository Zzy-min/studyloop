<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 110">
  <defs>
    <linearGradient id="corgiGold3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6A552"/>
      <stop offset="100%" stop-color="#D97A26"/>
    </linearGradient>
    <linearGradient id="corgiWhite3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7FAF7"/>
    </linearGradient>
    <linearGradient id="cushionGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8E2BE"/>
      <stop offset="100%" stop-color="#8DC694"/>
    </linearGradient>
  </defs>

  <!-- Green Round Cushion Base -->
  <ellipse cx="65" cy="85" rx="58" ry="20" fill="url(#cushionGrad)"/>
  <ellipse cx="65" cy="82" rx="54" ry="16" fill="#D4EDD7"/>
  <ellipse cx="65" cy="80" rx="46" ry="12" fill="#E8F6EA"/>

  <!-- Corgi Body Lying Down -->
  <ellipse cx="65" cy="65" rx="36" ry="18" fill="url(#corgiGold3)"/>
  <ellipse cx="65" cy="65" rx="20" ry="14" fill="url(#corgiWhite3)"/>

  <!-- Left Ear -->
  <path d="M 36 38 C 24 22, 28 4, 44 8 C 52 14, 52 30, 48 40 Z" fill="url(#corgiGold3)"/>
  <path d="M 38 34 C 30 20, 32 10, 42 14 C 46 18, 48 28, 45 35 Z" fill="#FBB6C4"/>
  <!-- Right Ear -->
  <path d="M 86 38 C 98 22, 94 4, 78 8 C 70 14, 70 30, 74 40 Z" fill="url(#corgiGold3)"/>
  <path d="M 84 34 C 92 20, 90 10, 80 14 C 76 18, 74 28, 77 35 Z" fill="#FBB6C4"/>

  <!-- Head resting forward -->
  <ellipse cx="61" cy="42" rx="26" ry="19" fill="url(#corgiGold3)"/>
  <!-- Snout -->
  <path d="M 61 28 C 58 28, 56 34, 55 39 C 48 40, 45 48, 49 55 C 54 60, 68 60, 73 55 C 77 48, 74 40, 67 39 C 66 34, 64 28, 61 28 Z" fill="url(#corgiWhite3)"/>

  <!-- Blush -->
  <circle cx="40" cy="49" r="3.8" fill="#FCA5A5" opacity="0.6"/>
  <circle cx="82" cy="49" r="3.8" fill="#FCA5A5" opacity="0.6"/>

  <!-- Friendly Sleepy/Gentle Eyes -->
  <path d="M 45 42 Q 49 46 53 42" fill="none" stroke="#241A13" stroke-width="2" stroke-linecap="round"/>
  <path d="M 69 42 Q 73 46 77 42" fill="none" stroke="#241A13" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 57 48 C 57 46, 65 46, 65 48 C 65 51, 61 52, 57 48 Z" fill="#241A13"/>

  <!-- Gentle Smile -->
  <path d="M 58 52 Q 61 55 64 52" fill="none" stroke="#241A13" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Front Paws resting on cushion -->
  <ellipse cx="48" cy="74" rx="7" ry="5" fill="url(#corgiWhite3)"/>
  <ellipse cx="74" cy="74" rx="7" ry="5" fill="url(#corgiWhite3)"/>
</svg>
