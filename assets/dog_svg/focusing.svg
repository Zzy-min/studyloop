<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="corgiGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2994A"/>
      <stop offset="100%" stop-color="#D47728"/>
    </linearGradient>
    <linearGradient id="corgiWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <!-- Left Ear -->
  <path d="M 23 48 C 12 30, 16 10, 31 16 C 39 20, 42 38, 38 48 Z" fill="url(#corgiGold)"/>
  <path d="M 24 43 C 18 28, 21 15, 30 19 C 35 22, 37 36, 34 43 Z" fill="#F9B7C6"/>
  <!-- Right Ear -->
  <path d="M 77 48 C 88 30, 84 10, 69 16 C 61 20, 58 38, 62 48 Z" fill="url(#corgiGold)"/>
  <path d="M 76 43 C 82 28, 79 15, 70 19 C 65 22, 63 36, 66 43 Z" fill="#F9B7C6"/>
  <!-- Body/Chest in loaf pose -->
  <path d="M 25 72 C 25 62, 75 62, 75 72 C 80 85, 75 95, 50 95 C 25 95, 20 85, 25 72 Z" fill="url(#corgiGold)"/>
  <path d="M 38 72 C 43 66, 57 66, 62 72 C 65 82, 60 90, 50 90 C 40 90, 35 82, 38 72 Z" fill="url(#corgiWhite)"/>
  <!-- Resting front paws -->
  <ellipse cx="36" cy="88" rx="7" ry="4.5" fill="url(#corgiWhite)"/>
  <ellipse cx="64" cy="88" rx="7" ry="4.5" fill="url(#corgiWhite)"/>
  <!-- Head Base -->
  <ellipse cx="50" cy="52" rx="30" ry="24" fill="url(#corgiGold)"/>
  <!-- White Snout / Blaze -->
  <path d="M 50 34 C 47 34, 46 42, 45 48 C 36 50, 34 60, 38 68 C 43 74, 57 74, 62 68 C 66 60, 64 50, 55 48 C 54 42, 53 34, 50 34 Z" fill="url(#corgiWhite)"/>
  <!-- Calm Focused Eyes (gentle steady gaze) -->
  <ellipse cx="37" cy="49" rx="3.8" ry="4.2" fill="#261B14"/>
  <circle cx="36" cy="48" r="1.3" fill="#FFFFFF"/>
  <ellipse cx="63" cy="49" rx="3.8" ry="4.2" fill="#261B14"/>
  <circle cx="62" cy="48" r="1.3" fill="#FFFFFF"/>
  <!-- Blush -->
  <circle cx="28" cy="57" r="4.5" fill="#FCA5A5" opacity="0.5"/>
  <circle cx="72" cy="57" r="4.5" fill="#FCA5A5" opacity="0.5"/>
  <!-- Nose -->
  <path d="M 46 57 C 46 54, 54 54, 54 57 C 54 60, 50 62, 46 57 Z" fill="#261B14"/>
  <circle cx="48.5" cy="56.5" r="0.8" fill="#FFFFFF" opacity="0.8"/>
  <!-- Peaceful Mouth -->
  <path d="M 46 62.5 Q 50 65 54 62.5" fill="none" stroke="#261B14" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="50" y1="59.5" x2="50" y2="63.5" stroke="#261B14" stroke-width="1.5" stroke-linecap="round"/>
</svg>
