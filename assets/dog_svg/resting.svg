<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="corgiGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2994A"/>
      <stop offset="100%" stop-color="#D47728"/>
    </linearGradient>
    <linearGradient id="corgiWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <!-- Curled Sleeping Body / Butt & Tail -->
  <ellipse cx="50" cy="66" rx="36" ry="24" fill="url(#corgiGold)"/>
  <path d="M 20 70 C 20 54, 80 54, 80 70 C 80 84, 20 84, 20 70 Z" fill="url(#corgiGold)"/>
  <ellipse cx="48" cy="74" rx="22" ry="12" fill="url(#corgiWhite)"/>
  <!-- Folded Sleepy Ears -->
  <path d="M 24 50 C 14 38, 20 22, 32 30 C 37 34, 38 46, 34 52 Z" fill="url(#corgiGold)"/>
  <path d="M 25 47 C 18 38, 23 27, 30 32 C 34 35, 35 44, 32 48 Z" fill="#F9B7C6"/>
  <path d="M 72 50 C 82 38, 76 22, 64 30 C 59 34, 58 46, 62 52 Z" fill="url(#corgiGold)"/>
  <path d="M 71 47 C 78 38, 73 27, 66 32 C 62 35, 61 44, 64 48 Z" fill="#F9B7C6"/>
  <!-- Sleeping Head Base -->
  <ellipse cx="48" cy="54" rx="26" ry="19" fill="url(#corgiGold)"/>
  <!-- White Snout / Blaze -->
  <path d="M 48 40 C 45 40, 44 46, 43 51 C 36 53, 35 60, 39 67 C 43 72, 53 72, 57 67 C 61 60, 60 53, 53 51 C 52 46, 51 40, 48 40 Z" fill="url(#corgiWhite)"/>
  <!-- Sleeping Eyes (Gentle peaceful closed arcs) -->
  <path d="M 34 52 Q 38 56 42 52" fill="none" stroke="#261B14" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 54 52 Q 58 56 62 52" fill="none" stroke="#261B14" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Sleepy Rosy Blush -->
  <circle cx="28" cy="58" r="4.5" fill="#FCA5A5" opacity="0.6"/>
  <circle cx="68" cy="58" r="4.5" fill="#FCA5A5" opacity="0.6"/>
  <!-- Cute Sleeping Button Nose -->
  <path d="M 45 59 C 45 56.5, 51 56.5, 51 59 C 51 61.5, 48 63, 45 59 Z" fill="#261B14"/>
  <!-- Peaceful Breathing Mouth -->
  <path d="M 45 64 Q 48 66 51 64" fill="none" stroke="#261B14" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tucked Little Paws -->
  <ellipse cx="38" cy="74" rx="5" ry="4" fill="url(#corgiWhite)"/>
  <ellipse cx="58" cy="74" rx="5" ry="4" fill="url(#corgiWhite)"/>
  <!-- Floating Zzz bubbles -->
  <text x="74" y="32" fill="#3B82F6" font-size="11" font-weight="800" font-family="sans-serif">z</text>
  <text x="82" y="24" fill="#60A5FA" font-size="13" font-weight="800" font-family="sans-serif">Z</text>
  <text x="91" y="16" fill="#93C5FD" font-size="15" font-weight="900" font-family="sans-serif">Z</text>
</svg>
