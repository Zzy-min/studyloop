<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="corgiGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2994A"/>
      <stop offset="100%" stop-color="#D47728"/>
    </linearGradient>
    <linearGradient id="corgiWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <!-- Left Ear (Slightly relaxed) -->
  <path d="M 23 48 C 12 32, 17 14, 31 20 C 39 24, 42 38, 38 48 Z" fill="url(#corgiGold)"/>
  <path d="M 24 43 C 18 30, 22 19, 30 23 C 35 26, 37 36, 34 43 Z" fill="#F9B7C6"/>
  <!-- Right Ear -->
  <path d="M 77 48 C 88 32, 83 14, 69 20 C 61 24, 58 38, 62 48 Z" fill="url(#corgiGold)"/>
  <path d="M 76 43 C 82 30, 78 19, 70 23 C 65 26, 63 36, 66 43 Z" fill="#F9B7C6"/>
  <!-- Body/Chest -->
  <path d="M 30 75 C 30 65, 70 65, 70 75 C 75 88, 68 96, 50 96 C 32 96, 25 88, 30 75 Z" fill="url(#corgiGold)"/>
  <path d="M 40 70 C 44 65, 56 65, 60 70 C 64 80, 58 92, 50 92 C 42 92, 36 80, 40 70 Z" fill="url(#corgiWhite)"/>
  <!-- Head Base -->
  <ellipse cx="50" cy="52" rx="30" ry="24" fill="url(#corgiGold)"/>
  <!-- White Snout / Blaze -->
  <path d="M 50 34 C 47 34, 46 42, 45 48 C 36 50, 34 60, 38 68 C 43 74, 57 74, 62 68 C 66 60, 64 50, 55 48 C 54 42, 53 34, 50 34 Z" fill="url(#corgiWhite)"/>
  <!-- Soft, Empathetic Reassuring Eyes -->
  <ellipse cx="37" cy="49" rx="4.0" ry="4.3" fill="#261B14"/>
  <circle cx="36" cy="47.5" r="1.6" fill="#FFFFFF"/>
  <circle cx="38" cy="50.5" r="0.7" fill="#FFFFFF"/>
  <ellipse cx="63" cy="49" rx="4.0" ry="4.3" fill="#261B14"/>
  <circle cx="62" cy="47.5" r="1.6" fill="#FFFFFF"/>
  <circle cx="64" cy="50.5" r="0.7" fill="#FFFFFF"/>
  <!-- Gentle Blush -->
  <circle cx="28" cy="57" r="4.5" fill="#FCA5A5" opacity="0.6"/>
  <circle cx="72" cy="57" r="4.5" fill="#FCA5A5" opacity="0.6"/>
  <!-- Nose -->
  <path d="M 46 57 C 46 54, 54 54, 54 57 C 54 60, 50 62, 46 57 Z" fill="#261B14"/>
  <circle cx="48.5" cy="56.5" r="0.8" fill="#FFFFFF" opacity="0.8"/>
  <!-- Warm Soft Smile -->
  <path d="M 46 62 Q 50 65.5 54 62" fill="none" stroke="#261B14" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="50" y1="59.5" x2="50" y2="63.5" stroke="#261B14" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Gentle Heart Icon -->
  <path d="M 80 26 C 77 22, 72 24, 72 28 C 72 33, 80 37, 80 37 C 80 37, 88 33, 88 28 C 88 24, 83 22, 80 26 Z" fill="#F43F5E"/>
</svg>
